name: Verify Hat Delaunay v68 on Lean 4.33.0-rc1

on:
  pull_request:
    branches: [main]
    paths:
      - 'HatActivationLedgerV68_SEALED.lean'
      - 'v68-kernel-gate/**'
      - '.github/workflows/verify-v68-rc1.yml'

permissions:
  contents: read

jobs:
  verify-v68-rc1:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Toolchain_factory
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Mathlib and exact Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/leanprover-community/mathlib4.git /tmp/mathlib4
          cd /tmp/mathlib4
          git checkout 79d0395a1825a6264ad5d269e35e60537518955e
          printf '%s\n' 'leanprover/lean4:v4.33.0-rc1' > lean-toolchain
          lake env lean --version | tee "$GITHUB_WORKSPACE/v68-lean-version.log"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.33.0-rc1'
          test "$(git rev-parse HEAD)" = '79d0395a1825a6264ad5d269e35e60537518955e'

      - name: Restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          lake exe cache get

      - name: Generate proof-producing activation-weight kernel source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from fractions import Fraction
          from math import comb
          from pathlib import Path

          out = Path('HatActivationLedgerV68_KERNEL_OPT.lean')
          lines = [
              'import HatActivationLedgerV68_SEALED',
              '',
              'namespace HatV68Kernel',
              '',
              'open HatV68Sealed',
              '',
              'set_option maxRecDepth 100000',
              'set_option maxHeartbeats 0',
              '',
              '/-- Exact kernel-checked activation weights, one theorem per unique `(r,f)` class. -/',
          ]
          names = []
          for r in range(34):
              for f in range(3, 6):
                  top = 1599 - r - f
                  w = Fraction(0, 1)
                  for j in range(240):
                      if r <= j:
                          q = j - r
                          if q <= top:
                              w += Fraction(comb(top, q), 1600 * comb(1599, j))
                  name = f'activationWeight_{r}_{f}'
                  names.append(name)
                  lines += [
                      f'theorem {name} : activationWeight {r} {f} =',
                      f'    ({w.numerator} : ℚ) / {w.denominator} := by',
                      '  norm_num [activationWeight, Finset.sum_range_succ]',
                      '',
                  ]
          proof_names = ', '.join(names)
          lines += [
              '/-- Kernel proof-producing low-order Hat ledger bound using certified activation weights. -/',
              'theorem hat_low_order_kernel_lt :',
              '    ledgerBound hatGroups < 176005 / 10000000 := by',
              f'  norm_num [ledgerBound, hatGroups, contribution, {proof_names}]',
              '',
              '/-- Kernel proof-producing low-order triangular ledger bound using certified activation weights. -/',
              'theorem triangular_low_order_kernel_lt :',
              '    ledgerBound triangularGroups < 255629 / 10000000 := by',
              f'  norm_num [ledgerBound, triangularGroups, contribution, {proof_names}]',
              '',
              '/-- Registered-tail Hat bound derived from the low-order kernel theorem. -/',
              'theorem hat_registered_final_kernel_lt :',
              '    ledgerBound hatGroups + registeredTail < 18291 / 1000000 := by',
              '  calc',
              '    ledgerBound hatGroups + registeredTail',
              '        < (176005 / 10000000 : ℚ) + registeredTail := by',
              '            exact add_lt_add_right hat_low_order_kernel_lt registeredTail',
              '    _ < 18291 / 1000000 := by norm_num [registeredTail]',
              '',
              '/-- Registered-tail triangular bound derived from the low-order kernel theorem. -/',
              'theorem triangular_registered_final_kernel_lt :',
              '    ledgerBound triangularGroups + registeredTail < 26253 / 1000000 := by',
              '  calc',
              '    ledgerBound triangularGroups + registeredTail',
              '        < (255629 / 10000000 : ℚ) + registeredTail := by',
              '            exact add_lt_add_right triangular_low_order_kernel_lt registeredTail',
              '    _ < 26253 / 1000000 := by norm_num [registeredTail]',
              '',
              '#print axioms hat_low_order_kernel_lt',
              '#print axioms triangular_low_order_kernel_lt',
              '#print axioms hat_registered_final_kernel_lt',
              '#print axioms triangular_registered_final_kernel_lt',
              '',
              'end HatV68Kernel',
              '',
          ]
          out.write_text('\n'.join(lines))
          print(f'generated {out} with {len(names)} exact activation-weight lemmas')
          PY
          sha256sum HatActivationLedgerV68_KERNEL_OPT.lean | tee V68_KERNEL_OPT_SOURCE.sha256

      - name: Kernel elaborate v68 activation weights and ledger
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/HatActivationLedgerV68_SEALED.lean" /tmp/mathlib4/HatActivationLedgerV68_SEALED.lean
          cp "$GITHUB_WORKSPACE/HatActivationLedgerV68_KERNEL_OPT.lean" /tmp/mathlib4/HatActivationLedgerV68_KERNEL_OPT.lean
          cd /tmp/mathlib4
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/HatActivationLedgerV68_SEALED.olean HatActivationLedgerV68_SEALED.lean 2>&1 | tee "$GITHUB_WORKSPACE/HatActivationLedgerV68_SEALED.build.log"
          lake env lean HatActivationLedgerV68_KERNEL_OPT.lean 2>&1 | tee "$GITHUB_WORKSPACE/HatActivationLedgerV68_KERNEL.kernel.log"

      - name: Audit proof output
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/HatActivationLedgerV68_KERNEL.kernel.log"
          test -s "$LOG"
          if grep -Fq 'sorryAx' "$LOG"; then
            echo 'Rejected: sorryAx found in v68 kernel log' >&2
            exit 1
          fi
          if grep -Fq '_native.native_decide.ax_' "$LOG"; then
            echo 'Rejected: native_decide axiom found in v68 kernel log' >&2
            exit 1
          fi
          grep -F 'hat_low_order_kernel_lt' "$LOG"
          grep -F 'triangular_low_order_kernel_lt' "$LOG"
          grep -F 'hat_registered_final_kernel_lt' "$LOG"
          grep -F 'triangular_registered_final_kernel_lt' "$LOG"

      - name: Write v68 kernel receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path.cwd()
          sealed = root / 'HatActivationLedgerV68_SEALED.lean'
          kernel = root / 'HatActivationLedgerV68_KERNEL_OPT.lean'
          log = root / 'HatActivationLedgerV68_KERNEL.kernel.log'
          text = log.read_text()
          version = (root / 'v68-lean-version.log').read_text().strip()
          receipt = {
              'schema': 'hat-delaunay-v68-kernel-receipt/4.0',
              'lean_toolchain': 'leanprover/lean4:v4.33.0-rc1',
              'lean_commit': '62eed1db4d67327ec8120be05f1a1b0847d74561',
              'mathlib_commit': '79d0395a1825a6264ad5d269e35e60537518955e',
              'sealed_source_sha256': hashlib.sha256(sealed.read_bytes()).hexdigest(),
              'kernel_source_sha256': hashlib.sha256(kernel.read_bytes()).hexdigest(),
              'kernel_log_sha256': hashlib.sha256(log.read_bytes()).hexdigest(),
              'activation_weight_lemmas': 102,
              'lean_version_output': version,
              'sorryAx_absent': 'sorryAx' not in text,
              'native_decide_axiom_absent': '_native.native_decide.ax_' not in text,
          }
          (root / 'V68_KERNEL_RECEIPT.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload v68 kernel evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hat-delaunay-v68-rc1-kernel-evidence
          path: |
            HatActivationLedgerV68_SEALED.lean
            HatActivationLedgerV68_KERNEL_OPT.lean
            HatActivationLedgerV68_KERNEL.kernel.log
            HatActivationLedgerV68_SEALED.build.log
            V68_KERNEL_RECEIPT.json
            V68_KERNEL_OPT_SOURCE.sha256
            v68-lean-version.log
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
