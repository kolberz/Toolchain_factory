name: Verify Frontier 27 serialized bytes and branch bound

on:
  push:
    branches: [agent/frontier27-byte-bnb]
    paths: ['research/frontier27/**', '.github/workflows/verify-frontier27.yml']
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-frontier27:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Publish run locator
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          target="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -nc --arg state pending --arg context frontier27-run --arg target_url "$target" --arg description "Frontier 27 run $GITHUB_RUN_ID" '{state:$state,context:$context,target_url:$target_url,description:$description}' >/tmp/status.json
          curl --fail-with-body -sS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --data-binary @/tmp/status.json

      - name: Install exact Lean 4.33.0-rc1
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.0-rc1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version | tee /tmp/lean-version.txt
          grep -F '4.33.0-rc1' /tmp/lean-version.txt
          grep -F '62eed1d' /tmp/lean-version.txt

      - name: Reconstruct and authenticate Frontier 23 closure
        run: |
          set -euo pipefail
          mkdir -p research/frontier25/formal frontier27-evidence/logs
          cat research/frontier25/closure-parts/part-* >/tmp/frontier23-formal-closure.tar.gz
          echo '2651de483bdbfe289270e746b6fbd9aabd8117d0e65c3e8727616d893c898d78  /tmp/frontier23-formal-closure.tar.gz' | sha256sum -c - | tee frontier27-evidence/logs/closure-archive-hash.log
          tar -C research/frontier25/formal -xzf /tmp/frontier23-formal-closure.tar.gz
          (cd research/frontier25/formal && sha256sum -c ../frontier23-source.sha256) | tee frontier27-evidence/logs/frontier23-source-hash.log

      - name: Recompile Frontier 23 WTC CNF LRAT closure
        run: |
          set -euo pipefail
          export LEAN_PATH="$PWD/research/frontier25/formal"
          cd research/frontier25/formal
          modules=(SSATseitin ExprCompiler FixedWidth Complexity SharedAdder SharedRipple SubsetSumFW SharedSubsetItem SharedSelectedSum SharedSubsetFrontend WordNat SubsetSumNat NaturalSubsetFrontend ClosedNaturalSubset ModularObstruction StrategyCompiler ResolutionCertificate ResolutionBridge FallbackRawResolution FallbackRawLRATBridge GCDStrategy GCDExamples ResidueReachability ResidueStrategy ResidueFallbackResolution ResidueFallbackLRATBridge)
          : > ../../../frontier27-evidence/logs/frontier23-recompile.log
          for m in "${modules[@]}"; do echo "=== $m ===" | tee -a ../../../frontier27-evidence/logs/frontier23-recompile.log; /usr/bin/time -v lean -o "$m.olean" "$m.lean" >>../../../frontier27-evidence/logs/frontier23-recompile.log 2>&1; done
          tail -100 ../../../frontier27-evidence/logs/frontier23-recompile.log

      - name: Recompile Frontier 24 parent
        run: |
          set -euo pipefail
          export LEAN_PATH="$PWD/research/frontier24:$PWD/research/frontier25/formal"
          cd research/frontier24
          /usr/bin/time -v lean -o Frontier24.olean Frontier24.lean >../../frontier27-evidence/logs/Frontier24-parent.log 2>&1
          cat ../../frontier27-evidence/logs/Frontier24-parent.log

      - name: Recompile Frontier 25 parent
        run: |
          set -euo pipefail
          export LEAN_PATH="$PWD/research/frontier25:$PWD/research/frontier25/formal:$PWD/research/frontier24"
          cd research/frontier25
          /usr/bin/time -v lean -o Frontier25.olean Frontier25.lean >../../frontier27-evidence/logs/Frontier25-parent.log 2>&1
          cat ../../frontier27-evidence/logs/Frontier25-parent.log

      - name: Recompile Frontier 26 parent
        run: |
          set -euo pipefail
          export LEAN_PATH="$PWD/research/frontier26:$PWD/research/frontier25:$PWD/research/frontier25/formal:$PWD/research/frontier24"
          cd research/frontier26
          /usr/bin/time -v lean -o Frontier26.olean Frontier26.lean >../../frontier27-evidence/logs/Frontier26-parent.log 2>&1
          cat ../../frontier27-evidence/logs/Frontier26-parent.log

      - name: Compile Frontier 27
        run: |
          set -euo pipefail
          export LEAN_PATH="$PWD/research/frontier27:$PWD/research/frontier26:$PWD/research/frontier25:$PWD/research/frontier25/formal:$PWD/research/frontier24"
          cd research/frontier27
          /usr/bin/time -v lean -o Frontier27.olean Frontier27.lean >../../frontier27-evidence/logs/Frontier27.log 2>&1
          cat ../../frontier27-evidence/logs/Frontier27.log

      - name: Semantic negative controls
        run: |
          set -euo pipefail
          cd research/frontier27
          printf 'import Frontier27\nopen WTCF27\nexample : certificateBytes pruneSeedBest = 10 := by decide\n' > NegativeWrongByteSize.lean
          printf 'import Frontier27\nopen WTCF27\nexample : pruneTrace.materialized = [20] := by decide\n' > NegativeMaterializedTail.lean
          printf 'import Frontier27\nopen WTCF27\nexample : pruneTrace.pruned = [20, 32] := by decide\n' > NegativePrunedTail.lean
          printf 'import Frontier27\nopen WTCF27\nexample : (WTCF25.chooseCosted pruneDemo pruneAllMods).map (fun c => (c.modulus, certificateBytes c)) = some (4, 10) := by decide\n' > NegativeExhaustiveChoice.lean
          printf 'import Frontier27\nopen WTCF27\nexample : WTCF26.portfolioMaterializationWork pruneDemo pruneAllMods - branchBoundMaterializationWork pruneDemo pruneSeedMods pruneTrace = 231 := by decide\n' > NegativeSavedWork.lean
          printf 'import Frontier27\nopen WTCF27\nexample : deserializeWords (serializeWords [256]) = [256] := by decide\n' > NegativeUnboundedRoundtrip.lean
          printf 'import Frontier27\nopen WTCF27\nexample : WTCF26.isResidue (chooseBytePortfolio WTCF23.residueFallback) = true := by decide\n' > NegativeFallbackBranch.lean
          export LEAN_PATH="$PWD:$PWD/../frontier26:$PWD/../frontier25:$PWD/../frontier25/formal:$PWD/../frontier24"
          for f in Negative*.lean; do log="../../frontier27-evidence/logs/${f%.lean}.log"; set +e; lean "$f" >"$log" 2>&1; rc=$?; set -e; cat "$log"; [[ $rc -ne 0 ]] || { echo "unexpected compile: $f"; exit 1; }; ! grep -Eqi 'unknown module|unknown module prefix|file.*not found|unknown identifier|unexpected token' "$log" || { echo "infrastructure failure: $f"; exit 1; }; echo "$f: SEMANTICALLY_REJECTED"; done

      - name: Hygiene and manifest
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(sorry|admit|sorryAx|native_decide)\b' research/frontier27 --include='*.lean'; then exit 1; fi
          sha256sum research/frontier27/Frontier27.lean research/frontier26/Frontier26.lean research/frontier25/Frontier25.lean research/frontier24/Frontier24.lean research/frontier25/formal/*.lean .github/workflows/verify-frontier27.yml | tee frontier27-evidence/SHA256SUMS.txt
          cp /tmp/lean-version.txt frontier27-evidence/lean-version.txt
          printf '%s\n' \
            'F23_SOURCE_CLOSURE=HASHED_RECOMPILED' \
            'F24_PARENT=RECOMPILED' \
            'F25_PARENT=RECOMPILED' \
            'F26_PARENT=RECOMPILED' \
            'F27_SERIALIZER=FIN256_ONE_BYTE_PER_WORD' \
            'F27_ROUNDTRIP=PROVED_FOR_MODULUS_LE_256' \
            'F27_BYTE_LENGTH=EXACT_STRUCTURAL_WORD_COUNT' \
            'F27_LOWER_BOUND=MODULUS_BYTES' \
            'F27_PRUNING=SOUND_PRE_MATERIALIZATION_BOUND' \
            'F27_EXHAUSTIVE_EQUIV=DECLARED_PORTFOLIO' \
            'F27_SAVED_WORK=232_LOOKUPS' \
            'NEGATIVE_CONTROLS=7_SEMANTIC_REJECTIONS' >frontier27-evidence/VERIFICATION.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontier27-verification-evidence
          path: frontier27-evidence/**
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90
