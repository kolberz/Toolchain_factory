name: Preflight DAG Lean proof
run-name: DAG Lean preflight · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DAGRestrictionUpdate.lean'
      - 'DAGSemiringSemantics.lean'
      - 'DAGSupportSensitive.lean'
      - 'DAGCofactorPair.lean'
      - 'DAGAllocatorContract.lean'
      - 'DAGReferenceAllocator.lean'
      - 'DAGSharedMemo.lean'
      - 'DAGOperationalMemo.lean'
      - 'DAGOperationalMemoProof.lean'
      - 'DAGOperationalMemoAllocation.lean'
      - '.github/workflows/preflight-dag-proof.yml'
      - 'toolchain-profiles.json'

concurrency:
  group: dag-lean-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lean-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install --yes jq zstd
      - name: Install exact Lean release
        shell: bash
        run: |
          set -euo pipefail
          profile="$(jq -ce '.profiles["lean-4.32.2"]' toolchain-profiles.json)"
          version="$(jq -r '.leanVersion' <<< "$profile")"
          artifact="$(jq -r '.releaseArtifact' <<< "$profile")"
          sha="$(jq -r '.releaseTarballSha256' <<< "$profile")"
          curl --fail --location --retry 3 \
            "https://github.com/leanprover/lean4/releases/download/v${version}/${artifact}" \
            -o "$RUNNER_TEMP/$artifact"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/$artifact" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/lean-release"
          tar --use-compress-program=unzstd -xf "$RUNNER_TEMP/$artifact" -C "$RUNNER_TEMP/lean-release"
          lean_home="$(find "$RUNNER_TEMP/lean-release" -mindepth 1 -maxdepth 1 -type d -name 'lean-*' -print -quit)"
          echo "$lean_home/bin" >> "$GITHUB_PATH"
          echo "LEAN_SYSROOT=$lean_home" >> "$GITHUB_ENV"
      - name: Prepare exact Mathlib release
        shell: bash
        run: |
          set -euo pipefail
          profile="$(jq -ce '.profiles["lean-4.32.2"]' toolchain-profiles.json)"
          tag="$(jq -r '.mathlibTag' <<< "$profile")"
          commit="$(jq -r '.mathlibCommit' <<< "$profile")"
          manifest_sha="$(jq -r '.mathlibLakeManifestSha256' <<< "$profile")"
          git clone --depth 1 --branch "$tag" https://github.com/leanprover-community/mathlib4.git "$RUNNER_TEMP/mathlib4"
          [[ "$(git -C "$RUNNER_TEMP/mathlib4" rev-parse HEAD)" == "$commit" ]]
          printf '%s  %s\n' "$manifest_sha" "$RUNNER_TEMP/mathlib4/lake-manifest.json" | sha256sum --check --strict
          cd "$RUNNER_TEMP/mathlib4"
          lake exe cache get
      - name: Kernel replay semantic restriction theorem
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mathlib4"
          cp "$GITHUB_WORKSPACE/DAGRestrictionUpdate.lean" DAGRestrictionUpdate.lean
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/DAGRestrictionUpdate.olean DAGRestrictionUpdate.lean \
            | tee "$GITHUB_WORKSPACE/dag-preflight.log"
      - name: Kernel replay generalized semiring semantics
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mathlib4"
          cp "$GITHUB_WORKSPACE/DAGSemiringSemantics.lean" DAGSemiringSemantics.lean
          lake env lean DAGSemiringSemantics.lean \
            | tee "$GITHUB_WORKSPACE/dag-semiring-preflight.log"
      - name: Kernel replay support-sensitive theorem layer
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mathlib4"
          cp "$GITHUB_WORKSPACE/DAGSupportSensitive.lean" DAGSupportSensitive.lean
          lake env lean -o .lake/build/lib/lean/DAGSupportSensitive.olean DAGSupportSensitive.lean \
            | tee "$GITHUB_WORKSPACE/dag-support-preflight.log"
      - name: Kernel replay paired cofactor traversal
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mathlib4"
          cp "$GITHUB_WORKSPACE/DAGCofactorPair.lean" DAGCofactorPair.lean
          lake env lean -o .lake/build/lib/lean/DAGCofactorPair.olean DAGCofactorPair.lean \
            | tee "$GITHUB_WORKSPACE/dag-pair-preflight.log"
      - name: Kernel replay allocator contract layer
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mathlib4"
          cp "$GITHUB_WORKSPACE/DAGAllocatorContract.lean" DAGAllocatorContract.lean
          lake env lean -o .lake/build/lib/lean/DAGAllocatorContract.olean DAGAllocatorContract.lean \
            | tee "$GITHUB_WORKSPACE/dag-allocator-preflight.log"
      - name: Kernel replay concrete reference allocator
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mathlib4"
          cp "$GITHUB_WORKSPACE/DAGReferenceAllocator.lean" DAGReferenceAllocator.lean
          lake env lean -o .lake/build/lib/lean/DAGReferenceAllocator.olean DAGReferenceAllocator.lean \
            | tee "$GITHUB_WORKSPACE/dag-reference-allocator-preflight.log"
      - name: Kernel replay shared DAG memo accounting
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mathlib4"
          cp "$GITHUB_WORKSPACE/DAGSharedMemo.lean" DAGSharedMemo.lean
          lake env lean -o .lake/build/lib/lean/DAGSharedMemo.olean DAGSharedMemo.lean \
            | tee "$GITHUB_WORKSPACE/dag-shared-memo-preflight.log"
      - name: Kernel replay operational DAG memo evaluator
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mathlib4"
          cp "$GITHUB_WORKSPACE/DAGOperationalMemo.lean" DAGOperationalMemo.lean
          lake env lean -o .lake/build/lib/lean/DAGOperationalMemo.olean DAGOperationalMemo.lean \
            | tee "$GITHUB_WORKSPACE/dag-operational-memo-preflight.log"
      - name: Kernel replay operational memo correctness proof
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mathlib4"
          cp "$GITHUB_WORKSPACE/DAGOperationalMemoProof.lean" DAGOperationalMemoProof.lean
          lake env lean -o .lake/build/lib/lean/DAGOperationalMemoProof.olean DAGOperationalMemoProof.lean \
            | tee "$GITHUB_WORKSPACE/dag-operational-proof-preflight.log"
      - name: Kernel replay operational memo allocation proof
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mathlib4"
          cp "$GITHUB_WORKSPACE/DAGOperationalMemoAllocation.lean" DAGOperationalMemoAllocation.lean
          lake env lean DAGOperationalMemoAllocation.lean \
            | tee "$GITHUB_WORKSPACE/dag-operational-allocation-preflight.log"
      - name: Reject placeholders
        run: |
          ! grep -nE '\bsorry\b|\badmit\b' \
            DAGRestrictionUpdate.lean DAGSemiringSemantics.lean \
            DAGSupportSensitive.lean DAGCofactorPair.lean \
            DAGAllocatorContract.lean DAGReferenceAllocator.lean \
            DAGSharedMemo.lean DAGOperationalMemo.lean DAGOperationalMemoProof.lean \
            DAGOperationalMemoAllocation.lean
      - name: Upload preflight logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dag-lean-preflight
          path: |
            dag-preflight.log
            dag-semiring-preflight.log
            dag-support-preflight.log
            dag-pair-preflight.log
            dag-allocator-preflight.log
            dag-reference-allocator-preflight.log
            dag-shared-memo-preflight.log
            dag-operational-memo-preflight.log
            dag-operational-proof-preflight.log
            dag-operational-allocation-preflight.log
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
