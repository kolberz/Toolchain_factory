name: Verify Frontier 25 native WTC linear residue

on:
  push:
    branches: [agent/frontier25-native-wtc-linear]
    paths: ['research/frontier25/**', '.github/workflows/verify-frontier25.yml']
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-frontier25:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Publish run locator
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          target="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -nc --arg state pending --arg context frontier25-run --arg target_url "$target" --arg description "Frontier 25 run $GITHUB_RUN_ID" '{state:$state,context:$context,target_url:$target_url,description:$description}' >/tmp/status.json
          curl --fail-with-body -sS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --data-binary @/tmp/status.json

      - name: Install exact Lean 4.33.0-rc1
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.0-rc1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version | tee /tmp/lean-version.txt
          grep -F '4.33.0-rc1' /tmp/lean-version.txt
          grep -F '62eed1d' /tmp/lean-version.txt

      - name: Reconstruct and authenticate Frontier 23 closure
        run: |
          set -euo pipefail
          mkdir -p research/frontier25/formal frontier25-evidence/logs
          cat research/frontier25/closure-parts/part-* >/tmp/frontier23-formal-closure.tar.gz
          echo '70f68b05c181f172f2e7c778c702aa4b29146f24e5905bc8de2ca2d6b12e9ae9  /tmp/frontier23-formal-closure.tar.gz' | sha256sum -c - | tee frontier25-evidence/logs/closure-archive-hash.log
          tar -C research/frontier25/formal -xzf /tmp/frontier23-formal-closure.tar.gz
          (cd research/frontier25/formal && sha256sum -c ../frontier23-source.sha256) | tee frontier25-evidence/logs/frontier23-source-hash.log

      - name: Recompile Frontier 23 WTC CNF LRAT closure
        run: |
          set -euo pipefail
          export LEAN_PATH="$PWD/research/frontier25/formal"
          cd research/frontier25/formal
          modules=(SSATseitin ExprCompiler FixedWidth Complexity SharedAdder SharedRipple SubsetSumFW SharedSubsetItem SharedSelectedSum SharedSubsetFrontend WordNat SubsetSumNat NaturalSubsetFrontend ClosedNaturalSubset ModularObstruction StrategyCompiler ResolutionCertificate ResolutionBridge FallbackRawResolution FallbackRawLRATBridge GCDStrategy GCDExamples ResidueReachability ResidueStrategy ResidueFallbackResolution ResidueFallbackLRATBridge)
          : > ../../../frontier25-evidence/logs/frontier23-recompile.log
          for m in "${modules[@]}"; do echo "=== $m ===" | tee -a ../../../frontier25-evidence/logs/frontier23-recompile.log; /usr/bin/time -v lean -o "$m.olean" "$m.lean" >>../../../frontier25-evidence/logs/frontier23-recompile.log 2>&1; done
          tail -100 ../../../frontier25-evidence/logs/frontier23-recompile.log

      - name: Recompile Frontier 24 parent
        run: |
          set -euo pipefail
          export LEAN_PATH="$PWD/research/frontier24:$PWD/research/frontier25/formal"
          cd research/frontier24
          /usr/bin/time -v lean -o Frontier24.olean Frontier24.lean >../../frontier25-evidence/logs/Frontier24-parent.log 2>&1
          cat ../../frontier25-evidence/logs/Frontier24-parent.log

      - name: Compile Frontier 25
        run: |
          set -euo pipefail
          export LEAN_PATH="$PWD/research/frontier25:$PWD/research/frontier25/formal:$PWD/research/frontier24"
          cd research/frontier25
          /usr/bin/time -v lean -o Frontier25.olean Frontier25.lean >../../frontier25-evidence/logs/Frontier25.log 2>&1
          cat ../../frontier25-evidence/logs/Frontier25.log

      - name: Semantic negative controls
        run: |
          set -euo pipefail
          cd research/frontier25
          printf 'import Frontier25\nopen WTCF25\nexample : linearTransitionWork 5 = 25 := by decide\n' > NegativeQuadraticWork.lean
          printf 'import Frontier25\nopen WTCF25\nexample : (choosePortfolio WTCF23.residueUpgrade).tag = .residue 5 := by decide\n' > NegativeWrongResidueBranch.lean
          printf 'import Frontier25\nopen WTCF25\nexample : (choosePortfolio WTCF23.residueFallback).tag = .residue 5 := by decide\n' > NegativeFallbackResidue.lean
          printf 'import Frontier25\nopen WTCF25\nexample : (chooseCosted WTCF23.residueUpgrade WTCF23.residuePortfolioModuli).map (fun c => c.cost) = some 11 := by decide\n' > NegativeArgmin.lean
          printf 'import Frontier25\nopen WTCF25\nexample : WTC.wordValue WTCF23.residueUpgrade.target %% 3 ∈ WTCF23.reachableResidues 3 WTCF23.residueUpgrade.values := by decide\n' > NegativeWTCBridge.lean
          export LEAN_PATH="$PWD:$PWD/formal:$PWD/../frontier24"
          for f in Negative*.lean; do log="../../frontier25-evidence/logs/${f%.lean}.log"; set +e; lean "$f" >"$log" 2>&1; rc=$?; set -e; cat "$log"; [[ $rc -ne 0 ]] || { echo "unexpected compile: $f"; exit 1; }; ! grep -Eqi 'unknown module|file.*not found|unknown identifier' "$log" || { echo "infrastructure failure: $f"; exit 1; }; echo "$f: SEMANTICALLY_REJECTED"; done

      - name: Hygiene and manifest
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(sorry|admit|sorryAx|native_decide)\b' research/frontier25 --include='*.lean'; then exit 1; fi
          sha256sum research/frontier25/Frontier25.lean research/frontier25/formal/*.lean .github/workflows/verify-frontier25.yml | tee frontier25-evidence/SHA256SUMS.txt
          cp /tmp/lean-version.txt frontier25-evidence/lean-version.txt
          printf '%s\n' 'F23_SOURCE_CLOSURE=HASHED_RECOMPILED' 'F24_PARENT=RECOMPILED' 'F25_LINEAR_WTC=KERNEL_CHECKED' 'WORK_MODEL=EXACT_n_times_m' 'ARGMIN=KERNEL_CHECKED' 'NEGATIVE_CONTROLS=5_SEMANTIC_REJECTIONS' >frontier25-evidence/VERIFICATION.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontier25-verification-evidence
          path: frontier25-evidence/**
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90
