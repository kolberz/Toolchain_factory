name: V89 Clause History Kernel Gate

on:
  push:
    branches:
      - research/v89-clause-history
    paths:
      - 'v89-harness/**'
      - '.github/workflows/v89-clause-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up exact Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: v89-harness
          auto-config: true
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Strict kernel compile
        working-directory: v89-harness
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('V89Harness.lean')
          s = p.read_text()
          s = s.replace('import Std.Tactic.Omega', 'import Lean.Elab.Tactic.Omega', 1)
          s = s.replace('open Sym State Move', 'open Sym State', 1)
          s = s.replace('(fun s => s = .clauseSpent)', '(fun s => s = clauseSpent)')
          s = s.replace('let spentMarkers := List.replicate j .clauseSpent',
                        'let spentMarkers : List Sym := List.replicate j clauseSpent', 1)

          old_scan_tail = '''          have hrec := ih (right := marker :: right) htail
                    exact hrec
          '''
          new_scan_tail = '''          have hrec := ih (right := marker :: right) htail
                    have hrec' :
                        run (List.length (next :: rest))
                          (configAt q (rest ++ baseHead :: baseLeft)
                            (next :: marker :: right)) =
                        configAt q baseLeft
                          (baseHead :: (next :: rest).reverse ++ marker :: right) := by
                      simpa [keepLeftScanConfig] using hrec
                    rw [hrec']
                    simp [List.reverse_cons, List.append_assoc]
          '''
          if old_scan_tail not in s:
              raise SystemExit('scan tail not found')
          s = s.replace(old_scan_tail, new_scan_tail, 1)

          old_run_add = '''theorem run_add (m n : Nat) (config : Config) :
              run (m + n) config = run n (run m config) := by
            induction m generalizing config with
            | zero => rfl
            | succ m ih =>
                simp only [Nat.succ_eq_add_one, Nat.add_assoc]
                change run (m + n + 1) config = _
                rw [show m + n + 1 = (m + 1) + n by omega]
                change run n (run (m + 1) config) = _
                rfl
          '''
          new_run_add = '''theorem run_add (m n : Nat) (config : Config) :
              run (m + n) config = run n (run m config) := by
            induction m generalizing config with
            | zero =>
                simp [run]
            | succ m ih =>
                rw [Nat.succ_add]
                change run (m + n) (stepConfig config) =
                  run n (run m (stepConfig config))
                exact ih (config := stepConfig config)
          '''
          if old_run_add not in s:
              raise SystemExit('run_add block not found')
          s = s.replace(old_run_add, new_run_add, 1)

          helper = '''
          theorem replicate_append_same_marker_harness
              (n : Nat) (a : Sym) (tail : List Sym) :
              List.replicate n a ++ a :: tail =
                List.replicate (n + 1) a ++ tail := by
            induction n with
            | zero => rfl
            | succ n ih =>
                rw [List.replicate_succ, List.replicate_succ]
                exact congrArg (fun xs => a :: xs) ih

          '''
          anchor = 'theorem run_historyFind_to_sign\n'
          if helper.strip() not in s:
              if anchor not in s:
                  raise SystemExit('history theorem anchor not found')
              s = s.replace(anchor, helper + anchor, 1)

          old_hfirst = '''    cases j with
              | zero => simp [keepLeftScanConfig, List.append_assoc]
              | succ n =>
                  rw [List.replicate_succ]
                  simp only [List.cons_append]
                  rw [step_clauseFind_clauseEnd]
                  simp [keepLeftScanConfig, List.append_assoc]
          '''
          new_hfirst = '''    cases j <;>
              simp [keepLeftScanConfig, run, stepConfig, transition, configAt,
                List.replicate_succ, List.append_assoc]
          '''
          if old_hfirst not in s:
              raise SystemExit('hfirst block not found')
          s = s.replace(old_hfirst, new_hfirst, 1)

          old_hlive = '''    rw [run_one, step_clauseFind_live]
              unfold cursorMarkers spentMarkers
              simp [List.append_assoc]
          '''
          new_hlive = '''    unfold cursorMarkers spentMarkers
              simp [run, stepConfig, transition, configAt, List.append_assoc]
          '''
          if old_hlive not in s:
              raise SystemExit('hlive block not found')
          s = s.replace(old_hlive, new_hlive, 1)

          cursor_start = s.index("  have hcursor' :")
          raw_start = s.index('  have hraw :', cursor_start)
          new_cursor = "\n".join([
              "  have hcursor' :",
              "      run (j + 1 + p)",
              "        (configAt (.clauseToCursor f c) (.clauseSpent :: baseLeft)",
              "          (cursorMarkers ++ literalRight)) =",
              "        configAt (.clauseToCursor f c)",
              "          (List.replicate p .processed ++ .clauseEnd ::",
              "            List.replicate (j + 1) .clauseSpent ++ baseLeft)",
              "          literalRight := by",
              "    have hlen : cursorMarkers.length = j + 1 + p := by",
              "      unfold cursorMarkers spentMarkers",
              "      simp only [List.length_append, List.length_replicate, List.length_cons]",
              "      omega",
              "    rw [← hlen]",
              "    rw [hcursor]",
              "    unfold cursorMarkers spentMarkers baseLeft literalRight",
              "    simp [List.reverse_append, List.replicate_succ, List.append_assoc,",
              "      replicate_append_same_marker_harness]",
              "",
          ])
          s = s[:cursor_start] + new_cursor + s[raw_start:]

          raw_start = s.index('  have hraw :')
          compose_start = s.index('  rw [show p + 2*j + 4', raw_start)
          new_raw = "\n".join([
              "  have hraw :",
              "      run 1 (configAt (.clauseToCursor f c)",
              "        (List.replicate p .processed ++ .clauseEnd ::",
              "          List.replicate (j + 1) .clauseSpent ++ baseLeft) literalRight) =",
              "        historySign f c j k p sign literalRest outerLeft tail := by",
              "    unfold literalRight",
              "    cases sign <;>",
              "      simp [run, stepConfig, transition, configAt, historySign, baseLeft,",
              "        List.append_assoc]",
              "",
          ])
          s = s[:raw_start] + new_raw + s[compose_start:]
          p.write_text(s)
          PY
          lake env lean V89Harness.lean 2>&1 | tee V89_KERNEL.log
          grep -F 'run_historyFind_to_sign' V89_KERNEL.log
          if grep -F 'sorryAx' V89_KERNEL.log; then
            echo 'unexpected sorryAx' >&2
            exit 1
          fi
          sha256sum V89Harness.lean | tee V89Harness.lean.sha256
      - name: Record exact toolchain
        working-directory: v89-harness
        run: |
          lean --version | tee -a V89_KERNEL.log
          lake --version | tee -a V89_KERNEL.log
      - name: Upload kernel evidence
        uses: actions/upload-artifact@v4
        with:
          name: v89-clause-history-kernel-evidence
          path: |
            v89-harness/V89_KERNEL.log
            v89-harness/V89Harness.lean
            v89-harness/V89Harness.lean.sha256
