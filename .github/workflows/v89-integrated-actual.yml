name: V89 Integrated Actual V88 Kernel Gate

on:
  push:
    branches:
      - research/v89-clause-history
    paths:
      - 'v89-integrated/**'
      - '.github/workflows/v89-integrated-actual.yml'
  pull_request:
    branches:
      - research/v89-clause-history
    paths:
      - 'v89-integrated/**'
      - '.github/workflows/v89-integrated-actual.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actual-v88:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up exact rc1 using proven v89 harness package
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: v89-harness
          auto-config: true
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Record proven toolchain
        working-directory: v89-harness
        run: |
          set -euo pipefail
          lean --version | tee ../v89-integrated/V89_LEAN_VERSION.txt
          lake --version | tee ../v89-integrated/V89_LAKE_VERSION.txt
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.33.0-rc1'

      - name: Reconstruct and verify exact actual-v88 closure
        run: |
          set -euo pipefail
          rm -rf v89-integrated/actual-src
          mkdir -p v89-integrated/actual-src
          python - <<'PY'
          from pathlib import Path
          import base64
          parts = sorted(Path('v89-integrated/xzchunks').glob('part_*'))
          expected = [12000] * 13 + [8608]
          if len(parts) != len(expected):
              raise SystemExit(f'expected 14 chunks, got {len(parts)}')
          alphabet = set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          payload = bytearray()
          with open('v89-integrated/V89_CHUNK_DIAGNOSTIC.txt', 'w') as log:
              for p, n in zip(parts, expected):
                  raw = p.read_bytes()
                  if len(raw) < n:
                      raise SystemExit(f'{p.name}: short chunk {len(raw)} < {n}')
                  canonical = raw[:n]
                  suffix = raw[n:]
                  bad = [(i, b) for i, b in enumerate(canonical) if b not in alphabet]
                  print(f'{p.name}: stored={len(raw)} canonical={n} suffix={len(suffix)} bad={bad[:8]} suffix_hex={suffix[:32].hex()}', file=log)
                  if bad:
                      raise SystemExit(f'{p.name}: invalid canonical base64 bytes {bad[:8]}')
                  payload.extend(canonical)
              print(f'joined_base64_bytes={len(payload)}', file=log)
              print(f'joined_mod4={len(payload) % 4}', file=log)
          Path('v89-integrated/v89_closure.tar.xz').write_bytes(
              base64.b64decode(bytes(payload), validate=True))
          PY
          cat v89-integrated/V89_CHUNK_DIAGNOSTIC.txt
          echo '0d0f9feb75c058dfb48e3604a2325fdaf05f4880bf2fa0f3f16ff0db9edd48d5  v89-integrated/v89_closure.tar.xz' | sha256sum -c -
          sha256sum v89-integrated/v89_closure.tar.xz | tee v89-integrated/V89_CLOSURE_SHA256.txt
          tar -xJf v89-integrated/v89_closure.tar.xz -C v89-integrated/actual-src
          test "$(find v89-integrated/actual-src -type f | wc -l)" -eq 82
          test "$(cat v89-integrated/actual-src/lean-toolchain)" = 'leanprover/lean4:v4.33.0-rc1'
          grep -F '"packages": []' v89-integrated/actual-src/lake-manifest.json
          cp v89-integrated/patch/SATMachineClauseHistoryPhase.lean \
            v89-integrated/actual-src/OpenProblems/Complexity/SATMachineClauseHistoryPhase.lean
          cp v89-integrated/patch/SATMachineClauseRecursionPhase.lean \
            v89-integrated/actual-src/OpenProblems/Complexity/SATMachineClauseRecursionPhase.lean

      - name: Build repaired actual clause-history and recursion seam
        working-directory: v89-integrated/actual-src
        run: |
          set -euo pipefail
          lake build OpenProblems.Complexity.SATMachineClauseHistoryPhase 2>&1 | tee ../V89_ACTUAL_BUILD.log
          lake env lean OpenProblems/Complexity/SATMachineClauseRecursionPhase.lean \
            -o .lake/build/lib/lean/OpenProblems/Complexity/SATMachineClauseRecursionPhase.olean \
            2>&1 | tee ../V89_RECURSION_BUILD.log

      - name: Kernel-audit recursive seam
        working-directory: v89-integrated/actual-src
        run: |
          set -euo pipefail
          cat > V89ActualGate.lean <<'LEAN'
          import OpenProblems.Complexity.SATMachineClauseRecursionPhase
          #print axioms OpenProblems.Complexity.SATMachineCertificatePhase.run_clauseHistoryFind_to_literalSign
          #print axioms OpenProblems.Complexity.SATMachineCertificatePhase.canonicalCNFLiteralEvaluatedConfig_eq_clauseHistoryFindConfig_next
          #print axioms OpenProblems.Complexity.SATMachineCertificatePhase.run_canonicalCNFLiteralEvaluated_to_nextLiteralSign
          #print axioms OpenProblems.Complexity.SATMachineCertificatePhase.run_cnfLiteral_total_then_nextSelector_trailingBlankRel
          LEAN
          lake env lean V89ActualGate.lean 2>&1 | tee ../V89_ACTUAL_KERNEL.log
          for theorem in \
            run_clauseHistoryFind_to_literalSign \
            canonicalCNFLiteralEvaluatedConfig_eq_clauseHistoryFindConfig_next \
            run_canonicalCNFLiteralEvaluated_to_nextLiteralSign \
            run_cnfLiteral_total_then_nextSelector_trailingBlankRel
          do
            grep -F "$theorem" ../V89_ACTUAL_KERNEL.log
          done
          if grep -F 'sorryAx' ../V89_ACTUAL_KERNEL.log; then
            echo 'unexpected sorryAx in recursive seam theorem closure' >&2
            exit 1
          fi
          sha256sum OpenProblems/Complexity/SATMachineClauseHistoryPhase.lean | tee ../SATMachineClauseHistoryPhase.lean.sha256
          sha256sum OpenProblems/Complexity/SATMachineClauseRecursionPhase.lean | tee ../SATMachineClauseRecursionPhase.lean.sha256

      - name: Publish diagnostic receipt and source snapshot
        if: always() && github.event_name == 'push'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          rm -rf v89-evidence/actual-v88
          mkdir -p v89-evidence/actual-v88/sources/OpenProblems/Complexity
          for f in V89_CHUNK_DIAGNOSTIC.txt V89_CLOSURE_SHA256.txt V89_LEAN_VERSION.txt V89_LAKE_VERSION.txt V89_ACTUAL_BUILD.log V89_RECURSION_BUILD.log V89_ACTUAL_KERNEL.log SATMachineClauseHistoryPhase.lean.sha256 SATMachineClauseRecursionPhase.lean.sha256; do
            if [ -f "v89-integrated/$f" ]; then cp "v89-integrated/$f" v89-evidence/actual-v88/; fi
          done
          if [ -d v89-integrated/actual-src ]; then
            for f in lean-toolchain lakefile.toml lake-manifest.json; do
              if [ -f "v89-integrated/actual-src/$f" ]; then cp "v89-integrated/actual-src/$f" v89-evidence/actual-v88/; fi
            done
            if [ -d v89-integrated/actual-src/OpenProblems/Complexity ]; then
              find v89-integrated/actual-src/OpenProblems/Complexity -maxdepth 1 -type f \( -name 'SATMachine*.lean' -o -name 'EncodedSAT*.lean' \) -print -exec cp {} v89-evidence/actual-v88/sources/OpenProblems/Complexity/ \;
            fi
          fi
          {
            echo "job_status=$JOB_STATUS"
            echo "head_before_evidence=$(git rev-parse HEAD)"
            echo "source_file_count=$(find v89-integrated/actual-src -type f 2>/dev/null | wc -l)"
            echo "captured_complexity_sources=$(find v89-evidence/actual-v88/sources/OpenProblems/Complexity -type f 2>/dev/null | wc -l)"
            if [ -f v89-integrated/V89_CLOSURE_SHA256.txt ]; then cat v89-integrated/V89_CLOSURE_SHA256.txt; fi
          } > v89-evidence/actual-v88/REPORT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v89-evidence/actual-v88
          if git diff --cached --quiet; then
            echo 'diagnostic receipt unchanged'
          else
            git commit -m "v89 evidence: recursive seam gate $JOB_STATUS"
            git push origin HEAD:research/v89-clause-history
          fi

      - name: Upload actual-source kernel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v89-integrated-actual-v88-kernel-evidence
          path: |
            v89-integrated/V89_CHUNK_DIAGNOSTIC.txt
            v89-integrated/V89_CLOSURE_SHA256.txt
            v89-integrated/V89_LEAN_VERSION.txt
            v89-integrated/V89_LAKE_VERSION.txt
            v89-integrated/V89_ACTUAL_BUILD.log
            v89-integrated/V89_RECURSION_BUILD.log
            v89-integrated/V89_ACTUAL_KERNEL.log
            v89-integrated/SATMachineClauseHistoryPhase.lean.sha256
            v89-integrated/SATMachineClauseRecursionPhase.lean.sha256
            v89-integrated/actual-src/OpenProblems/Complexity/SATMachineClauseHistoryPhase.lean
            v89-integrated/actual-src/OpenProblems/Complexity/SATMachineClauseRecursionPhase.lean
